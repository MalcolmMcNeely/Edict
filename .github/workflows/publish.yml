name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump applied to the latest v* tag'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: 'Dry run: push to the NuGet test gallery, skip the real tag, nuget.org push, and Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
    steps:
      - name: Guard dispatch to main
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Release dispatch must run from main, got ${{ github.ref }}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute next version
        id: version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${{ github.event.inputs.bump }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Latest tag '$latest' + ${{ github.event.inputs.bump }} -> $next"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git-cliff --config cliff.toml --unreleased --output RELEASE_NOTES.md
          else
            git-cliff --config cliff.toml --latest --output RELEASE_NOTES.md
          fi
          {
            echo "## Release notes preview"
            echo
            cat RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push tag
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: Restore
        run: dotnet restore Edict/Edict.slnx

      - name: Build
        run: dotnet build Edict/Edict.slnx --configuration Release --no-restore

      - name: Test (excluding Edict.Benchmarks.Throughput.Tests)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t projects < <(find . \( -name '*.Tests.csproj' -o -name 'Edict.Tests.Conformance.csproj' \) -not -path '*Edict.Benchmarks.Throughput.Tests*' | sort)
          for project in "${projects[@]}"; do
            echo "::group::Testing $project"
            dotnet test "$project" --configuration Release --no-build
            echo "::endgroup::"
          done

      - name: Pack
        run: dotnet pack Edict/Edict.slnx --configuration Release --output ./artifacts

      - name: Push
        shell: bash
        env:
          DRYRUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          if [ "$DRYRUN" = "true" ]; then
            dotnet nuget push "./artifacts/*.nupkg" \
              --api-key "${{ secrets.NUGET_INT_API_KEY }}" \
              --source https://apiint.nugettest.org/v3/index.json \
              --skip-duplicate
          else
            dotnet nuget push "./artifacts/*.nupkg" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.next || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
