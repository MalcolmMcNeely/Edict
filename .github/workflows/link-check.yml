name: Link check

# Scope rule: link-check every consumer-facing doc folder. Internal folders
# (docs/adr, docs/theorycrafting) are deliberately out — they are not a
# consumer's contract with the framework. New consumer-facing folders must be
# added to both the paths filter and the lychee args below by hand.
on:
  pull_request:
    paths:
      - 'docs/usage/**'
      - 'docs/configuration/**'
      - 'docs/operations/**'
      - 'docs/benchmarks/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'Edict/Edict.*/README.md'
      - '.github/workflows/link-check.yml'
      - '.github/lychee.toml'
  push:
    branches:
      - main
    paths:
      - 'docs/usage/**'
      - 'docs/configuration/**'
      - 'docs/operations/**'
      - 'docs/benchmarks/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'Edict/Edict.*/README.md'
      - '.github/workflows/link-check.yml'
      - '.github/lychee.toml'

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .github/lychee.toml
            --no-progress
            README.md
            AGENTS.md
            'docs/usage/**/*.md'
            'docs/configuration/**/*.md'
            'docs/operations/**/*.md'
            'docs/benchmarks/**/*.md'
            'Edict/Edict.*/README.md'
          fail: true
