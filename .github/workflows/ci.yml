name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Container-free projects (unit, codegen, telemetry, agentic tooling, reflection-only
  # architecture tests, in-proc sample tests). The whole solution builds once here, so this
  # job also doubles as the "everything compiles" gate, then each project tests with --no-build.
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Edict/Edict.slnx

      - name: Build
        run: dotnet build Edict/Edict.slnx --configuration Release --no-restore

      - name: Test (container-free projects)
        shell: bash
        run: |
          set -euo pipefail
          # Exclude benchmarks and every Testcontainers-backed project — those run in docker-tests.
          mapfile -t projects < <(find . -name '*.Tests.csproj' \
            -not -path '*Benchmarks*' \
            -not -path '*Edict.Azure.Streaming.Tests*' \
            -not -path '*Edict.Azure.Persistence.Tests*' \
            -not -path '*Edict.Kafka.Tests*' \
            -not -path '*Edict.Postgres.Tests*' \
            -not -path '*Edict.Pairing.Tests*' | sort)
          for project in "${projects[@]}"; do
            echo "::group::Testing $project"
            dotnet test "$project" --configuration Release --no-build \
              --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage"
            echo "::endgroup::"
          done

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ github.workspace }}/coverage
          fail_ci_if_error: false

  # Testcontainers-backed projects (Azurite / Kafka / Postgres). One matrix leg per project so
  # each gets a dedicated runner and Docker daemon — no cross-test container contention.
  # A new container-backed test project needs adding here; container-free ones join fast-tests
  # automatically via the exclusion find above.
  docker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Edict/Edict.Azure.Streaming.Tests/Edict.Azure.Streaming.Tests.csproj
          - Edict/Edict.Azure.Persistence.Tests/Edict.Azure.Persistence.Tests.csproj
          - Edict/Edict.Kafka.Tests/Edict.Kafka.Tests.csproj
          - Edict/Edict.Postgres.Tests/Edict.Postgres.Tests.csproj
          - Edict/Edict.Pairing.Tests/Edict.Pairing.Tests.csproj
          - Edict/Edict.Tests.Conformance/Edict.Tests.Conformance.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Test ${{ matrix.project }}
        run: >
          dotnet test "${{ matrix.project }}" --configuration Release
          --collect:"XPlat Code Coverage" --results-directory "${{ github.workspace }}/coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ github.workspace }}/coverage
          fail_ci_if_error: false
