name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs to save minutes, but let every push to main run to
  # completion: a burst of main pushes must not cancel each other's CI, or a
  # regression can land behind a stale-green badge with no run that ever saw it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast/docker split lives in the reusable tests workflow so CI and Publish
  # run the suite identically. CI is the coverage-bearing caller.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      upload-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
