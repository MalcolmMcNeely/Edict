name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast/docker split lives in the reusable tests workflow so CI and Publish
  # run the suite identically. CI is the coverage-bearing caller.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      upload-coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
