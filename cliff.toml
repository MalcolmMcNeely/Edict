# git-cliff configuration. Generates the GitHub Release body from the Conventional-Commit
# prefixes on the squash-merged commits since the last tag: feat -> Features, fix -> Fixes,
# breaking changes called out first. docs and chore are dropped so the notes carry only
# consumer-relevant change. This is a CI tool (MIT), not a package dependency.

[changelog]
header = ""
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}\
### Breaking Changes
{% for commit in breaking %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^docs", skip = true },
  { message = "^chore", skip = true },
]
